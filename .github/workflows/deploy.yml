name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    - cron: '43 5 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Run deployment script
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # Repository Variables，阅读次数基数，实际会向上抖动最多 20%
      run: |
        python main.py

    # 微信读书的 wr_rt 每次 renewal 都会轮转且只有 7 天寿命。
    # 不把轮转后的值写回 Secret，下次运行就还是拿最初那个 wr_rt，7 天后必然鉴权失败。
    - name: 回写刷新后的 cookie 到 WXREAD_CURL_BASH
      if: ${{ always() }}
      env:
        GH_TOKEN: ${{ secrets.WXREAD_SECRET_PAT }}
        GH_REPO: ${{ github.repository }}
      run: |
        if [ ! -s new_curl_bash.txt ]; then
          echo "本次没有生成新的 curl bash（renewal 未成功），跳过回写"
          exit 0
        fi
        if [ -z "$GH_TOKEN" ]; then
          echo "未配置 WXREAD_SECRET_PAT，跳过回写；登录态仍会在 7 天后失效"
          exit 0
        fi
        gh secret set WXREAD_CURL_BASH < new_curl_bash.txt
        echo "已回写 WXREAD_CURL_BASH（$(wc -c < new_curl_bash.txt) 字节）"

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1

  cleanup-job:
    name: Cleanup Old Runs
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 清理旧的运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 成功的留 7 天；失败的留 30 天，方便回头查故障日志
          OK_CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          ALL_CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "删除 $OK_CUTOFF 之前的成功记录，以及 $ALL_CUTOFF 之前的全部记录"
          gh api --paginate \
            "repos/$GH_REPO/actions/workflows/deploy.yml/runs?per_page=100" \
            --jq ".workflow_runs[]
                  | select(.created_at < \"$ALL_CUTOFF\"
                           or (.created_at < \"$OK_CUTOFF\" and .conclusion == \"success\"))
                  | .id" \
          | while read -r RUN_ID; do
              [ -z "$RUN_ID" ] && continue
              echo "Deleting run $RUN_ID"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$RUN_ID" --silent || true
            done
